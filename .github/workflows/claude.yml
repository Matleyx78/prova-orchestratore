name: Claude

# Starts Claude Code when a comment, review or issue mentions @claude.
# Authentication uses the owner's Claude Max subscription through the
# CLAUDE_CODE_OAUTH_TOKEN secret (created with `claude setup-token`).
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # Only the owner can start Claude (Codex writes with the owner's token).
    if: |
      github.actor == 'Matleyx78' && (
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    env:
      # Used by `gh` inside Claude's shell (labels, comments, CI wait).
      GH_TOKEN: ${{ github.token }}
      # Used only by scripts/passa-a-codex.sh: Codex answers only to the owner.
      GH_TOKEN_UTENTE: ${{ secrets.RELAY_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Read "[modello: ...]" and "[impegno: ...]" from the triggering text.
      # Only known values are accepted; anything else falls back to the default.
      - name: Read model and effort
        id: opts
        env:
          TEXT: ${{ github.event.comment.body || github.event.review.body || github.event.issue.body }}
        run: |
          model=opus
          effort=medium
          lower="$(printf '%s' "$TEXT" | tr '[:upper:]' '[:lower:]')"
          if [[ "$lower" =~ \[modello:[[:space:]]*([a-z]+)[[:space:]]*\] ]]; then
            case "${BASH_REMATCH[1]}" in
              opus|sonnet|haiku) model="${BASH_REMATCH[1]}" ;;
            esac
          fi
          if [[ "$lower" =~ \[impegno:[[:space:]]*([a-z ]+)\] ]]; then
            v="$(printf '%s' "${BASH_REMATCH[1]}" | xargs)"
            case "$v" in
              basso) effort=low ;;
              medio) effort=medium ;;
              alto) effort=high ;;
              "molto alto") effort=xhigh ;;
              massimo) effort=max ;;
            esac
          fi
          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "effort=$effort" >> "$GITHUB_OUTPUT"
          echo "Model: $model, effort: $effort"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Temporary: show Claude's output in the log to diagnose failures.
          show_full_output: true
          claude_args: >-
            --model ${{ steps.opts.outputs.model }}
            --effort ${{ steps.opts.outputs.effort }}
            --append-system-prompt "Sei stato avviato con il modello ${{ steps.opts.outputs.model }} e l'impegno ${{ steps.opts.outputs.effort }}: scrivili cosi nelle pull request e nelle revisioni."
            --allowedTools "Edit,Write,Bash(gh:*),Bash(git:*),Bash(python3:*),Bash(scripts/ci-attendi.sh:*),Bash(bash scripts/ci-attendi.sh:*),Bash(scripts/passa-a-codex.sh:*),Bash(bash scripts/passa-a-codex.sh:*)"
